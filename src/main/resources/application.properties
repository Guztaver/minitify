spring.application.name=minitify

# MongoDB configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://minitify:minitify@localhost:27017/minitify}
spring.data.mongodb.database=${MONGO_DATABASE:minitify}

# JWT configuration
security.jwt.shared-secret=${JWT_SHARED_SECRET:my-secret-key-that-is-at-least-256-bits-long-for-hs256}
security.jwt.issuer=${JWT_ISSUER:minitify}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Spring Data REST configuration - disable auto-exposure of repositories
spring.data.rest.detection-strategy=annotated

# Logging configuration
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_MONGODB_CORE_MONGOTEMPLATE:DEBUG}

# OpenAPI Configuration
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=true
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

# Scalar API Documentation Configuration
scalar.enabled=true
scalar.url=/openapi.json
scalar.path=/docs
scalar.showSidebar=true
scalar.hideModels=false
scalar.hideTestRequestButton=false
scalar.darkMode=false
scalar.hideDarkModeToggle=false
scalar.theme=default
scalar.layout=modern
scalar.hideSearch=false
scalar.documentDownloadType=both
scalar.actuatorEnabled=true

# Actuator configuration for Scalar
management.endpoints.web.exposure.include=health,info,scalar
management.endpoint.health.show-details=when-authorized

# Server configuration for HTTPS
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Server address binding
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
